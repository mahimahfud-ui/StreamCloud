name: StreamCloud quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamcloud-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript, JSON, and local assets
        run: npm run lint

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test catalog link extraction
        run: python -m unittest scripts.test_check_links -v

      - name: Install browser test runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node scripts/smoke.mjs

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Supabase Edge Function providers and fallback
        run: deno test --node-modules-dir=auto --allow-env tests/ai_router_test.ts tests/provider_health_test.ts
        working-directory: supabase/functions

