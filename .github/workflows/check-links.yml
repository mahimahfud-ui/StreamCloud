name: Check MahiFlix external links

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mahiflix-link-check
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check external sites
        run: python scripts/check_links.py

      - name: Commit refreshed link status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add link-status.json
          if git diff --cached --quiet; then
            echo "No status file changes to commit."
          else
            git commit -m "chore: refresh MahiFlix link status"
            git push origin main
          fi
